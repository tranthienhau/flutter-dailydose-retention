<!-- Top Status Bar Area -->

<!-- iOS Status Bar Simulation -->

<span>9:41</span>
<div class="flex items-center space-x-1.5 text-text-primary">
<span class="material-symbols-outlined text-[17px]">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[17px]">wifi</span>
<span class="material-symbols-outlined text-[20px] rotate-90 leading-none">battery_full</span>
</div>
</div>
<!-- TopAppBar Shared Component execution -->
<div class="flex justify-between items-center w-full px-5 py-2.5 bg-transparent">
<div class="flex items-center space-x-2">
<span class="material-symbols-outlined text-accent-fill text-[26px]" data-icon="spa">spa</span>
<span class="font-display text-title font-bold text-accent-fill tracking-tight">DailyDose</span>
</div>
<!-- Day streak / clean status indicator pill -->
<div class="flex items-center space-x-1.5 px-3 py-1 bg-surface-alt rounded-full text-accent-fill hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-[17px] text-accent-fill fill" data-icon="local_fire_department">local_fire_department</span>
<span class="font-label text-label font-bold text-accent-fill text-xs">Day 1</span>
</div>
</div>
<!-- Greeting & Date Block -->
<div class="px-5 pt-1.5 pb-2">
<h1 class="font-display text-[26px] leading-8 font-bold text-text-primary">Hi Maya</h1>
<p class="font-caption text-caption text-text-secondary mt-0.5">Thursday, Oct 2</p>
</div>
</header>
<!-- Scrollable/Centered Content Canvas -->
<section class="flex-1 px-5 flex flex-col justify-center items-center z-10 -mt-2">
<!-- Central Empty State Bento Card with real photo -->
<div class="w-full bg-surface rounded-[24px] soft-card-shadow p-5 flex flex-col items-center text-center transition-all duration-300">
<!-- Pill organizer photo focal asset -->

<img alt="Real photo: empty weekly pill organizer on a marble kitchen counter next to a glass of water" class="w-full h-full object-contain transform scale-105" src="https://lh3.googleusercontent.com/aida/AEtjO1X9-X-nRAG66JXpMCX1nhpXIna5MDVj3VLri56X98rc4tC7BMvFwWON5uHwz7aRsnVtDIGat40odPqCWGcdHkKwe7yqdTozLmDNmM9EsWpItUIRoX50XOG47ERSKLwz5lzPp8LeOmOCKMoU5sEdIGhKzyVPHBKAARJiShEXB_QKxGzAFcj2-jrN2q4dB8aPXhLK4Lq4EDPpQhpUidv_RPOtpjWgfula303eGEyCzuZwHVQuIHSj_Fbu0SA">
</div>
<!-- Empty State Typography -->
<h2 class="font-display text-[24px] leading-7 font-bold text-text-primary">

        </h2>
<p class="font-body text-[15px] leading-snug text-text-secondary mt-1.5 max-w-[250px]">
          Add your first reminder in under a minute
        </p>

<button class="w-full mt-5 h-12 bg-accent-fill hover:bg-accent-pressed active:scale-95 text-on-primary rounded-full flex items-center justify-center space-x-2 font-label text-[16px] font-bold shadow-md shadow-accent-fill/20 transition-all duration-150" id="btn-add-reminder" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="add">add</span>
<span>Add reminder</span>
</button>
</div>
<!-- Quick Start Suggestions -->
<div class="w-full mt-4 flex flex-col items-start px-1">

          Popular to start

</button>

<!-- Tab 2: Routines (Inactive) -->

<span class="font-label text-[11px] leading-[14px] font-medium text-text-tertiary group-hover:text-accent-fill transition-colors mt-1">Routines</span>

</div>

<!-- Interactive feedback for quick start items -->
<script>
    document.querySelectorAll('.flex-wrap button').forEach(button => {
      button.addEventListener('click', () => {
        const text = button.innerText.replace('+', '').trim();
        const mainBtnText = document.querySelector('#btn-add-reminder span:last-child');
        if (mainBtnText) {
          mainBtnText.textContent = `Add ${text}`;
          button.classList.add('bg-accent-fill', 'text-white');
          button.classList.remove('bg-accent-tint', 'text-accent-fill');
          setTimeout(() => {
            button.classList.remove('bg-accent-fill', 'text-white');
            button.classList.add('bg-accent-tint', 'text-accent-fill');
            mainBtnText.textContent = 'Add reminder';
          }, 2000);
        }
      });
    });
  </script>
